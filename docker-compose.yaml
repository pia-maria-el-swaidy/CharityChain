# Three TraceChain nodes on one network.   Start:  docker compose up -d --build
# From your computer the nodes are:  http://127.0.0.1:5001   http://127.0.0.1:5002   http://127.0.0.1:5003
# Between themselves the containers use their service names:  http://node1:5000 ...

x-node: &node
  build: .
  image: tracechain-node
  restart: "no"            # a stopped node stays stopped, so that you can test failures
  init: true               # a small init process as PID 1, so that "docker stop" ends the node at once
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/chain')"]
    interval: 5s
    timeout: 3s
    retries: 5

x-env: &env
  # the peer list: the same variable for all nodes (a node ignores its own URL, given in SELF_URL)
  PEERS: "http://node1:5000,http://node2:5000,http://node3:5000"
  # SYNC_ON_START: "1"     # a restarted node fetches the chain from its peers by itself
  # AUTO_MINE: "5"         # mine automatically every 5 seconds when transactions are pending
  # NO_SIGNATURES: "1"     # accept unsigned transactions (the unsigned experiments only)

services:
  node1:
    <<: *node
    hostname: node1
    ports: ["5001:5000"]
    environment:
      <<: *env
      SELF_URL: "http://node1:5000"

  node2:
    <<: *node
    hostname: node2
    ports: ["5002:5000"]
    environment:
      <<: *env
      SELF_URL: "http://node2:5000"

  node3:
    <<: *node
    hostname: node3
    ports: ["5003:5000"]
    environment:
      <<: *env
      SELF_URL: "http://node3:5000"

# All three services are on the default network created by Compose, where each service name is a host name.