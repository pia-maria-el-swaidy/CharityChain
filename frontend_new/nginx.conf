server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Docker's internal DNS; names are resolved at request time, so the page
  # still loads when a node is stopped (that is what the fault-tolerance demo does).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $gateway http://gateway:5000;
    proxy_pass $gateway;
    proxy_read_timeout 30s;
  }

  location ~ ^/node/([1-4])/(.*)$ {
    set $target http://node$1:5000/$2$is_args$args;
    proxy_pass $target;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  location ~ ^/node/5/(.*)$ {
    set $target http://observer:5000/$1$is_args$args;
    proxy_pass $target;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  location / {
    try_files $uri /index.html;
  }
}
